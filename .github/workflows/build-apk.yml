name: Build Android APK V0.6.1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto V0.6.1
        run: |
          mkdir extracted
          unzip -q MinutaAI-v0.6.1-work-ready-source.zip -d extracted

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descargar Vosk español
        run: |
          mkdir -p extracted/MinutaAI-v0.6.1-work-ready/android/app/src/main/assets

          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip \
            -o extracted/MinutaAI-v0.6.1-work-ready/android/app/src/main/assets/vosk-model-small-es-0.42.zip

      - name: Descargar Whisper Small q5_1 multilingüe
        run: |
          mkdir -p extracted/MinutaAI-v0.6.1-work-ready/android/app/src/main/assets/models

          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin \
            -o extracted/MinutaAI-v0.6.1-work-ready/android/app/src/main/assets/models/ggml-small-q5_1.bin

          test -s extracted/MinutaAI-v0.6.1-work-ready/android/app/src/main/assets/models/ggml-small-q5_1.bin

      - name: Compilar APK V0.6.1
        working-directory: extracted/MinutaAI-v0.6.1-work-ready/android
        run: |
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinutaAI-v0.6.1-APK
          path: extracted/MinutaAI-v0.6.1-work-ready/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
