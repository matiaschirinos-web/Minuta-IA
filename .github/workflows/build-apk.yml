name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir extracted
          unzip -q MinutaAI-v0.3-background-offline-buildready-source.zip -d extracted

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          echo "SDK root: $SDKROOT"
          echo "sdkmanager: $SDKMANAGER"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ajustar compatibilidad MediaPipe
        working-directory: extracted/MinutaAI-v0.3-background-offline/android
        run: |
          FILE="app/src/main/java/cl/minutaai/app/LocalMinuteEngine.kt"
          sed -i '/\.setTopK(20)/d' "$FILE"
          sed -i '/\.setTemperature(0.2f)/d' "$FILE"
          sed -i '/\.setRandomSeed(42)/d' "$FILE"

      - name: Compilar APK
        working-directory: extracted/MinutaAI-v0.3-background-offline/android
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinutaAI-v0.3-APK
          path: extracted/MinutaAI-v0.3-background-offline/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
